<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FOODPICKER ITF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #3f74cc;
      --red: #ea5f58;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #2b2f3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Sarabun", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--blue);
      color: #fff;
      padding: 14px 24px;
      font-size: 14px;
    }
    .navbar .title { font-family: "Mitr", sans-serif; font-size: 20px; }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
      gap: 20px;
    }
    .card {
      width: 100%;
      max-width: 340px;
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 6px 24px rgba(0,0,0,.08);
    }
    .photo {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 14px;
      overflow: hidden;
      background: #fde8e6;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #name { font-family: "Mitr", sans-serif; color: var(--red); font-size: 26px; margin-top: 16px; }
    #desc { color: #6b7280; margin-top: 6px; }
    #price {
      display: inline-block;
      margin-top: 12px;
      background: #fde8e6;
      color: var(--red);
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 999px;
    }

    #randomBtn {
      width: 100%;
      max-width: 340px;
      font-family: "Mitr", sans-serif;
      font-size: 18px;
      color: #fff;
      background: var(--red);
      border: none;
      border-radius: 999px;
      padding: 14px;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    #randomBtn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(234,95,88,.35); }
    #randomBtn:active { transform: translateY(0); }
    #randomBtn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  </style>
</head>
<body>

  <header class="navbar">
    <span>69070018</span>
    <span class="title">FOODPICKER ITF</span>
    <span>Week15</span>
  </header>

  <main>
    <section class="card" aria-live="polite">
      <div class="photo" id="photo"></div>
      <h1 id="name"></h1>
      <p id="desc"></p>
      <span id="price"></span>
    </section>

    <button id="randomBtn" type="button">สุ่มเมนูอาหาร</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
